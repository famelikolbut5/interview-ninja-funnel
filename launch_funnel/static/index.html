<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Interview Ninja | Статистика</title>
  <link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/dashboard.css">
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <script src="/assets/dashboard.js" defer></script>
</head>
<body>
  <main class="shell">
    <header class="header">
      <div class="brand"><img src="/assets/mark.svg" width="38" height="38" alt=""><span>Interview Ninja</span></div>
      <span class="connection" id="connection">Подключение</span>
    </header>
    <section class="hero" aria-labelledby="page-title">
      <img class="hero-art" src="/assets/cover.jpg" alt="Ниндзя готовится к собеседованию за ноутбуком" fetchpriority="high">
      <h1 id="page-title" class="visually-hidden">Статистика Interview Ninja</h1>
    </section>
    <section class="notice" id="status" role="status" aria-live="polite">
      <img src="/assets/mark.svg" alt="" width="48" height="48">
      <div><h2 id="status-title">Загружаем статистику</h2><p id="status-text">Это займёт несколько секунд.</p><small id="error-id" hidden></small></div>
    </section>
    <div id="report" hidden>
      <section class="overview" aria-label="Воронка регистрации">
        <div class="conversion">
          <div class="ring" id="ring" aria-hidden="true"><svg viewBox="0 0 120 120"><circle class="ring-base" cx="60" cy="60" r="52"/><circle id="ring-value" cx="60" cy="60" r="52" pathLength="100"/></svg><img src="/assets/mark.svg" alt="" width="48" height="48"></div>
          <div><h2>Конверсия</h2><strong id="conversion">0%</strong></div>
        </div>
        <dl class="totals">
          <div><dt>Запустили бота</dt><dd id="started">0</dd><dd class="track" aria-hidden="true"><span id="started-bar"></span></dd></div>
          <div><dt>Зарегистрировались</dt><dd id="registered">0</dd><dd class="track" aria-hidden="true"><span id="registered-bar"></span></dd></div>
        </dl>
      </section>
      <p class="empty" id="empty" hidden>Пока тихо. После первого /start здесь появятся участники.</p>
      <section class="delivery" aria-labelledby="delivery-heading">
        <div class="section-heading"><h2 id="delivery-heading">Рассылка</h2></div>
        <ol class="timeline" id="steps"></ol>
      </section>
      <footer><time id="checked-at"></time><button id="demo-toggle" type="button" aria-pressed="false">Показать демо</button></footer>
    </div>
  </main>
  <template id="step-template"><li class="step"><div class="step-line"><span class="step-time"></span><div class="step-copy"><h3 class="step-title"></h3></div><strong class="step-result" aria-label="Отправлено"></strong></div></li></template>
</body>
</html>
