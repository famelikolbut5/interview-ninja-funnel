greeting: |-
  🥷 <b>Подсказка есть. А что сказать дальше?</b>

  На собесе мало получить ответ. Нужно понять его, объяснить своими словами и не растеряться, когда интервьюер меняет условие.

  Приходи на вебинар "Interview Ninja под твою вакансию".

  Разберём настройку помощника на конкретной задаче. Добавим резюме и вакансию, зададим формат ответов и проверим, где ИИ ошибается. Потом потренируемся отвечать на уточнения.

  Нажми "Поделиться номером" внизу, чтобы записаться на вебинар.
share_button: Поделиться номером
registered: Ты в списке на вебинар. Сейчас пришлю небольшое задание для подготовки.
already_registered: Ты уже записан на вебинар. Два сообщения для подготовки придут в этот чат.
wrong_contact: Нужен твой контакт. Нажми "Поделиться номером" под полем ввода.
start_first: Сначала нажми /start, чтобы начать регистрацию.
unexpected_input: Для регистрации нажми "Поделиться номером". Если кнопка пропала, отправь /start.
temporary_error: Не получилось обработать сообщение. Попробуй ещё раз через несколько секунд.
dashboard_button: Статистика
dashboard_prompt: Регистрации и рассылка в одном месте.
dashboard_denied: Статистика доступна владельцу бота.
messages:
  - title: Вопрос для разбора
    delay_seconds: 10
    image: question.jpg
    text: |-
      🥷 <b>Принеси вопрос, на котором завис</b>

      Возьми вопрос с прошлого собеса или из вакансии. Ответь сам, потом задай его Interview Ninja и сравни ответы.

      Для начала попробуй такой промпт.

      <blockquote>Готовлюсь на Python backend middle. Дай короткий ответ и пример на Python. Потом задай уточняющий вопрос как интервьюер. Не придумывай мой опыт.</blockquote>

      Замени роль на свою. Сохрани вопрос и ответы. На вебинаре разберём, что получилось и где нужна практика.
  - title: Подготовка к вебинару
    delay_seconds: 60
    image: resume.jpg
    text: |-
      <b>Подготовь резюме и вакансию</b>

      Выбери вакансию, на которую хочешь попасть. Добавь её и резюме в Interview Ninja во вкладке "Резюме и вакансия".

      Проверь предпросмотр и включи оба документа. По умолчанию они выключены.

      На вебинаре настроим ответы под твой опыт и потренируемся на вопросах для этой роли.

      Ещё не запускал приложение? Вот <a href="https://interview-ninja.com/">сайт</a> и <a href="https://t.me/interview_ninja_channel/227">видео по настройке</a>.
