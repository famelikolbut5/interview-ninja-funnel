[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-launch-funnel"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.20,<4",
    "fastapi>=0.115,<1",
    "loguru>=0.7,<1",
    "psycopg[binary]>=3.3,<4",
    "pydantic>=2.10,<3",
    "python-dotenv>=1,<2",
    "PyYAML>=6,<7",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "mypy>=1.15,<2", "pytest>=8,<10", "types-PyYAML>=6,<7"]

[tool.setuptools.packages.find]
include = ["launch_funnel*"]

[tool.setuptools.package-data]
launch_funnel = ["static/*", "migrations/*.sql"]

[tool.mypy]
strict = true
files = ["launch_funnel", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
